<div class="container p-2">
  <div class="row p-3 mt-5">
    <div class="col-lg-8 center animated fadeInRight">
      <blockquote class="blockquote bq-success">
        <p class="bq-title">Welcome!</p>
        <p>
          Get data about the weather in your city, compare global and your local
          temperature easily by beautiful line chart!
        </p>
      </blockquote>
    </div>
  </div>

  <hr />
  <div class="row p-3 mt-2">
    <div class="col-lg-8 center animated fadeInLeft">
      <mdb-card class="p-3">
        <img class="mt-3" src="assets/statistics.svg" alt="" />
        <mdb-card-body>
          <div class="text-center mt-1 mb-1">
            <small class="text-muted"> Type your city name below: </small>
          </div>
          <form [formGroup]="searchForm" (ngSubmit)="submitForm()">
            <div class="md-form input-group">
              <input
                formControlName="searchTerm"
                mdbInput
                type="text"
                id="search"
                class="form-control"
              />
              <label for="search" class="">City (e.g. Tashkent)</label>

              <div class="input-group-append">
                <span class="md-addon">
                  <button
                    class="search-btn"
                    type="submit"
                    mdbBtn
                    color="success"
                    mdbWavesEffect
                  >
                    <mdb-icon fas icon="search"></mdb-icon></button
                ></span>
              </div>
            </div>
          </form>

          <div class="text-center">
            <span class="red-text">{{ error }}</span>
          </div>
        </mdb-card-body>
      </mdb-card>
    </div>
  </div>
  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
  <div *ngIf="!isLoading && isHaveChart" class="animated zoomInUp">
    <h3 class="h3-responsive text-center">{{ city }}</h3>
    <angular-image-viewer
      [src]="chartLink"
      class="img-fluid"
    ></angular-image-viewer>
  </div>
</div>
